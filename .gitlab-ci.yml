stages:
  - check
  - publish

check:
  stage: check
  image: python:3.12.3
  before_script:
    - pip install uv
    - uv sync --group dev
  script:
    - uv run pyright
    - uv run pytest

publish:
  stage: publish
  image: python:3.12.3
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - pip install uv build
  script:
    - python -m build
    - >-
      uv pip install
      --index-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi/simple
      --extra-index-url https://pypi.org/simple
      twine
    - >-
      TWINE_USERNAME=gitlab-ci-token
      TWINE_PASSWORD=${CI_JOB_TOKEN}
      twine upload
      --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi
      dist/*
