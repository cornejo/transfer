stages:
  - check
  - publish

check:
  stage: check
  image: python:3.12.3
  before_script:
    - pip install uv
    - uv sync --group dev
  script:
    - uv run pyright
    - uv run pytest

publish:
  stage: publish
  image: python:3.12.3
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    SETUPTOOLS_SCM_PRETEND_VERSION: ${CI_COMMIT_TAG#v}
  before_script:
    - pip install uv
  script:
    - uv build
    - uv publish --publish-url "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi"
      --username gitlab-ci-token --password "${CI_JOB_TOKEN}"
