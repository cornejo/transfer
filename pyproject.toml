[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transfer"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "cryptography>=42.0",
]

[project.scripts]
transfer = "transfer.cli:main"

[dependency-groups]
dev = ["pytest", "pyright"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
filterwarnings = ["error"]
