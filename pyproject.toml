[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "transfer"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "cryptography>=42.0",
]

[project.scripts]
transfer = "transfer.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/transfer/_version.py"

[dependency-groups]
dev = ["pytest", "pyright"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
filterwarnings = ["error"]
