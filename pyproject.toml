[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transfer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "cryptography>=42.0",
]

[project.scripts]
transfer = "transfer.cli:main"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
